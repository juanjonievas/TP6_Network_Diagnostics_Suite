name: Build Android APK (Cloud CI/CD)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate_and_build:
    name: Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps
          npm ci --prefix backend

      - name: Run Automated Tests
        run: npm run test

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkDiagnosticsSuite-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        run: |
          echo "### 🚀 Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "La APK de depuración ha sido generada por GitHub Actions en la nube." >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ubicación de descarga:** Pestaña *Artifacts* de esta ejecución." >> $GITHUB_STEP_SUMMARY
          echo "- **Instalación:** Descargar en el celular y presionar sobre el archivo o ejecutar \`adb install app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
